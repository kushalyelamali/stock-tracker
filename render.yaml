# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stock-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CACHE_TTL_SECONDS
        value: 120
